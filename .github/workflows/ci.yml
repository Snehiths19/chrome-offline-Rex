name: CI

on:
  push:
    branches-ignore: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run game tests
        run: npm test

      - name: Coverage report (information only, never fails the build)
        run: |
          npx c8 --include script.js --reporter=text-summary npm test > coverage.txt
          sed -n '/Coverage summary/,$p' coverage.txt
          {
            echo '### Test coverage of script.js'
            echo '```'
            sed -n '/Coverage summary/,$p' coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium

      - name: Play the game in a real browser (desktop and phone sizes)
        run: npm run test:browser

      - name: Compare key screens to the stored reference images
        if: always()
        run: npm run test:visual


      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-screenshots
          path: |
            tests/browser/screenshots/
            tests/browser/visual-diffs/
          if-no-files-found: ignore
