<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Chrome Dino Game</title>
    <link rel="stylesheet" href="style.css?v=__VERSION__" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#f0f0f0" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Rex Run" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  </head>
  <body>
    <div id="game-wrapper" role="application" aria-label="Chrome dino game">
      <button id="mute-btn" type="button" aria-pressed="false" aria-label="Mute sound">
        &#x1F50A;
      </button>
      <button id="daily-btn" type="button" aria-pressed="false" aria-label="Daily challenge">
        &#x1F4C5;
      </button>
      <div id="mode-toggle" role="group" aria-label="Game mode">
        <button type="button" data-mode="classic" aria-pressed="false">Classic</button>
        <button type="button" data-mode="updated" aria-pressed="true">Updated</button>
      </div>
      <canvas
        id="gameCanvas"
        width="600"
        height="200"
        aria-label="Dino running game. Press space to jump."
      ></canvas>
      <p id="rotate-hint" hidden>&#x21BB; Turn your phone sideways for a bigger view</p>
      <button id="jump-btn" aria-label="Jump">TAP TO JUMP</button>
      <button id="share-btn" aria-label="Share daily result" style="display: none">
        &#x1F4CB; Copy result
      </button>
      <div id="a11y-live" class="sr-only" aria-live="polite" aria-atomic="true"></div>
    </div>
    <!-- The game, in load order (src/files.js lists the same files). -->
    <script src="src/01-node-stubs.js?v=__VERSION__"></script>
    <script src="src/02-config.js?v=__VERSION__"></script>
    <script src="src/03-assets.js?v=__VERSION__"></script>
    <script src="src/04-state.js?v=__VERSION__"></script>
    <script src="src/05-rendering.js?v=__VERSION__"></script>
    <script src="src/06-physics.js?v=__VERSION__"></script>
    <script src="src/07-input.js?v=__VERSION__"></script>
    <script src="src/08-loop.js?v=__VERSION__"></script>
    <script src="src/09-init.js?v=__VERSION__"></script>
    <script src="src/10-test-exposure.js?v=__VERSION__"></script>
  </body>
</html>
