<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Rex Run: the Chrome offline dino game</title>
    <meta
      name="description"
      content="The Chrome offline dino game. Jump the cacti, beat your best, and play the Daily Challenge. Works without a connection."
    />
    <link rel="canonical" href="https://snehiths19.github.io/chrome-offline-Rex/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Rex Run" />
    <meta property="og:title" content="Rex Run" />
    <meta
      property="og:description"
      content="The Chrome offline dino game. Jump the cacti, beat your best, and play the Daily Challenge. Works without a connection."
    />
    <meta property="og:url" content="https://snehiths19.github.io/chrome-offline-Rex/" />
    <meta
      property="og:image"
      content="https://snehiths19.github.io/chrome-offline-Rex/share-card.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The pixel dino jumping a cactus under the words REX RUN"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Rex Run" />
    <meta
      name="twitter:description"
      content="The Chrome offline dino game. Jump the cacti, beat your best, and play the Daily Challenge. Works without a connection."
    />
    <meta
      name="twitter:image"
      content="https://snehiths19.github.io/chrome-offline-Rex/share-card.png"
    />
    <meta
      name="twitter:image:alt"
      content="The pixel dino jumping a cactus under the words REX RUN"
    />
    <link rel="stylesheet" href="style.css?v=__VERSION__" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#f0f0f0" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Rex Run" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  </head>
  <body>
    <div id="game-wrapper" role="application" aria-label="Chrome dino game">
      <button id="mute-btn" type="button" aria-pressed="false" aria-label="Mute sound">
        &#x1F50A;
      </button>
      <button id="daily-btn" type="button" aria-pressed="false" aria-label="Daily challenge">
        &#x1F4C5;
      </button>
      <button id="ghost-btn" type="button" aria-pressed="true" aria-label="Ghost of your best run">
        &#x1F47B;
      </button>
      <div id="mode-toggle" role="group" aria-label="Game mode">
        <button type="button" data-mode="classic" aria-pressed="false">Classic</button>
        <button type="button" data-mode="updated" aria-pressed="true">Updated</button>
      </div>
      <button
        id="fullscreen-btn"
        type="button"
        aria-pressed="false"
        aria-label="Play fullscreen"
        hidden
      >
        <svg class="fs-enter" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" />
        </svg>
        <svg class="fs-exit" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path d="M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5" />
        </svg>
      </button>
      <canvas
        id="gameCanvas"
        width="600"
        height="200"
        aria-label="Dino running game. Press space to jump."
      ></canvas>
      <p id="rotate-hint" hidden>&#x21BB; Turn your phone sideways for a bigger view</p>
      <button id="jump-btn" aria-label="Start">TAP TO START</button>
      <button id="share-btn" aria-label="Share daily result" style="display: none">
        &#x1F4CB; Copy result
      </button>
      <div id="a11y-live" class="sr-only" aria-live="polite" aria-atomic="true"></div>
    </div>
    <!-- The game, in load order (src/files.js lists the same files). -->
    <script src="src/01-node-stubs.js?v=__VERSION__"></script>
    <script src="src/02-config.js?v=__VERSION__"></script>
    <script src="src/03-assets.js?v=__VERSION__"></script>
    <script src="src/04-state.js?v=__VERSION__"></script>
    <script src="src/05-rendering.js?v=__VERSION__"></script>
    <script src="src/06-physics.js?v=__VERSION__"></script>
    <script src="src/07-input.js?v=__VERSION__"></script>
    <script src="src/08-loop.js?v=__VERSION__"></script>
    <script src="src/09-init.js?v=__VERSION__"></script>
    <script src="src/10-test-exposure.js?v=__VERSION__"></script>
  </body>
</html>
